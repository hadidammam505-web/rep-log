<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rep Log</title>
  <meta name="description" content="A fast, offline, bilingual (Arabic / English) gym tracker with PRs, 1RM estimates, progress charts and a rest timer.">
  <meta name="theme-color" content="#0b0b0d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icon.svg" alt="" width="32" height="32">
      <h1>Rep Log</h1>
    </div>
    <div class="top-actions">
      <button id="langBtn" class="ghost" aria-label="Switch language">عربي</button>
      <button id="themeBtn" class="ghost" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="log" class="active" data-i18n="tabLog">Log</button>
    <button role="tab" data-tab="history" data-i18n="tabHistory">History</button>
    <button role="tab" data-tab="progress" data-i18n="tabProgress">Progress</button>
    <button role="tab" data-tab="timer" data-i18n="tabTimer">Timer</button>
  </nav>

  <main>
    <!-- LOG -->
    <section id="tab-log" class="panel active">
      <form id="setForm" class="card">
        <h2 data-i18n="addSet">Add a set</h2>
        <label><span data-i18n="exercise">Exercise</span>
          <input id="exercise" list="exList" required autocomplete="off" placeholder="Squat">
          <datalist id="exList"></datalist>
        </label>
        <div class="row">
          <label><span><span data-i18n="weight">Weight</span> (<span id="unitLbl">kg</span>)</span>
            <input id="weight" type="number" inputmode="decimal" min="0" step="0.5" required>
          </label>
          <label><span data-i18n="reps">Reps</span>
            <input id="reps" type="number" inputmode="numeric" min="1" step="1" required>
          </label>
          <label><span data-i18n="rpe">RPE</span>
            <input id="rpe" type="number" inputmode="decimal" min="1" max="10" step="0.5">
          </label>
        </div>
        <button type="submit" class="primary" data-i18n="save">Save set</button>
        <p id="prBanner" class="pr" hidden></p>
      </form>

      <div class="card">
        <div class="card-head">
          <h2 data-i18n="today">Today</h2>
          <span id="todayVol" class="muted"></span>
        </div>
        <ul id="todayList" class="sets"></ul>
        <p id="todayEmpty" class="muted" data-i18n="noSets">No sets yet. Go lift something heavy.</p>
      </div>

      <div class="stats" id="stats"></div>
    </section>

    <!-- HISTORY -->
    <section id="tab-history" class="panel">
      <div class="card">
        <div class="card-head">
          <h2 data-i18n="tabHistory">History</h2>
          <div class="btns">
            <button id="exportBtn" class="ghost" data-i18n="export">Export</button>
            <label class="ghost filebtn"><span data-i18n="import">Import</span><input id="importFile" type="file" accept="application/json" hidden></label>
          </div>
        </div>
        <div id="historyList"></div>
        <p id="historyEmpty" class="muted" data-i18n="noHistory">Your workouts will show up here.</p>
      </div>
    </section>

    <!-- PROGRESS -->
    <section id="tab-progress" class="panel">
      <div class="card">
        <div class="card-head">
          <h2 data-i18n="tabProgress">Progress</h2>
          <select id="progEx" aria-label="Exercise"></select>
        </div>
        <canvas id="chart" height="260"></canvas>
        <p class="muted small" data-i18n="chartNote">Estimated 1RM per session (Epley: w × (1 + reps / 30)).</p>
        <div id="prTable"></div>
      </div>
      <div class="card">
        <h2 data-i18n="calc">1RM calculator</h2>
        <div class="row">
          <label><span data-i18n="weight">Weight</span><input id="cW" type="number" min="0" step="0.5" value="100"></label>
          <label><span data-i18n="reps">Reps</span><input id="cR" type="number" min="1" max="20" value="5"></label>
        </div>
        <div id="calcOut" class="calc"></div>
      </div>
    </section>

    <!-- TIMER -->
    <section id="tab-timer" class="panel">
      <div class="card timer">
        <h2 data-i18n="rest">Rest timer</h2>
        <div class="ring">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="52" class="track"/>
            <circle cx="60" cy="60" r="52" class="bar" id="ringBar"/>
          </svg>
          <div id="timeLeft" class="time">1:30</div>
        </div>
        <div class="presets">
          <button data-sec="60">1:00</button>
          <button data-sec="90" class="active">1:30</button>
          <button data-sec="120">2:00</button>
          <button data-sec="180">3:00</button>
          <button data-sec="300">5:00</button>
        </div>
        <div class="btns center">
          <button id="startBtn" class="primary" data-i18n="start">Start</button>
          <button id="resetBtn" class="ghost" data-i18n="reset">Reset</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="muted small">
    <span data-i18n="footer">Data stays on your device.</span>
    · <button id="unitBtn" class="link">kg / lb</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
